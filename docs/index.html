<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savely — Save & Organize</title>
<style>
  :root {
    --bg: #27262b;
    --fg: #f5f5f5;
    --muted: #aaa;
    --accent: #ffffff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .container { padding: 40px 20px; max-width: 600px; }
  h1 { font-size: 36px; margin: 0 0 12px; color: var(--accent); }
  p { font-size: 16px; color: var(--muted); margin: 8px 0; }
  .links { margin-top: 32px; }
  a {
    display: inline-block;
    margin: 8px;
    padding: 12px 24px;
    border: 1px solid var(--muted);
    border-radius: 8px;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
  }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <h1>Savely</h1>
  <p>Save and organize content from any platform into your personal digital library.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:bostancibasituna58@gmail.com">Contact</a>
  </div>
</div>
</body>
</html>
